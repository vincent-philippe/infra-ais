services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  app:
    build: ./app
    image: harbor.horizon.fr/game-app/app:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - backend
      - frontend
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    build: ./nginx
    image: harbor.horizon.fr/game-app/nginx:latest
    ports:
      - "80:8080"
    networks:
      - frontend
    depends_on:
      - app
    restart: unless-stopped

networks:
  backend:
  frontend:

volumes:
  db_data:
