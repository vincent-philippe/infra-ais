network:
  version: 2
  renderer: networkd
  ethernets:
    # remove enp1s0f0 ip, opnsense will acquire it from dhcp
    enp1s0f0:
      match:
        macaddress: 0c:c4:7a:85:82:66
      dhcp4: false
      dhcp6: false
      set-name: "enp1s0f0"
      macaddress: 6e:69:8e:a0:73:77
  bridges:
    # public wan
    br-wan:
      interfaces: [enp1s0f0]
      dhcp4: false
      dhcp6: false
      macaddress: 16:0c:55:5d:9f:82
    # 10.0.99.0/24 gateway is OPNsense's USER leg (10.0.99.1)
    br-user:
      dhcp4: true
    # 10.0.100.0/24 gateway is OPNsense's ADMIN leg (10.0.100.1)
    br-admin:
      dhcp4: true
    # 192.168.122.0/27 gateway is OPNsense's DMZ leg (192.168.122.1)
    br-dmz:
      dhcp4: false
      dhcp6: false