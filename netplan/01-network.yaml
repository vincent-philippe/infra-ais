network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0f0:
      match:
        macaddress: 0c:c4:7a:85:82:66
      dhcp4: false
      dhcp6: false
      set-name: "enp1s0f0"
  bridges:
    br-wan:
      interfaces: [enp1s0f0]
      dhcp4: false
      dhcp6: false
    br-user:
      dhcp4: true
      addresses:
        - 10.0.99.0/24
    br-admin:
      dhcp4: true
      addresses:
        - 10.0.100.0/24
    br-dmz:
      dhcp4: false
      dhcp6: false