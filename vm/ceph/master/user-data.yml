#cloud-config
users:
  - name: admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${AUTHORIZED_KEY}
chpasswd:
  expire: false
  users:
    - name: admin
      password: ${CONSOLE_ADMIN_PASSWORD}
      type: text
package_update: true
packages:
  - docker.io
  - lvm2
  - chrony
runcmd:
  - systemctl enable --now docker
  - curl --silent --remote-name --location https://download.ceph.com/rpm-reef/el9/noarch/cephadm
  - chmod +x cephadm
  - mv cephadm /usr/sbin/
  - cephadm --image quay.io/ceph/ceph:v18 bootstrap
    --mon-ip ${DOMAIN_IP}
    --cluster-network ${CLUSTER_NETWORK}
    --initial-dashboard-password ${CEPH_DASHBOARD_PASSWORD}
    --dashboard-password-noupdate
    --allow-fqdn-hostname
  - cephadm shell -- ceph orch apply mon 3 # limit to 3 nodes
  - cephadm shell -- ceph orch apply osd --all-available-devices # deploy osd disk
  - sleep 120 # time to deploy osd
  - cephadm shell -- ceph osd pool create docker-pool 32 32 replicated
  - cephadm shell -- ceph osd pool set docker-pool pg_autoscale_mode on
  - cephadm shell -- ceph osd pool application enable docker-pool rbd
  - cephadm shell --mount /etc/ceph:/etc/ceph -- ceph auth get-or-create client.docker
    mon 'allow r'
    osd 'profile rbd pool=docker-pool'
    -o /etc/ceph/ceph.client.docker.keyring
  - cephadm shell -- ceph osd pool create backup-pool 32 32 replicated
  # size=2, not the cluster default of 3: raw OSD capacity is tight (300G/node,
  # 3 nodes targeted) and already shared with docker-pool, so a 3x-replicated
  # 300G quota alone could saturate the cluster
  - cephadm shell -- ceph osd pool set backup-pool size 2
  - cephadm shell -- ceph osd pool set backup-pool pg_autoscale_mode on
  - cephadm shell -- ceph osd pool application enable backup-pool rbd
  - cephadm shell -- ceph osd pool set-quota backup-pool max_bytes 322122547200 # 300G
  - cephadm shell --mount /etc/ceph:/etc/ceph -- ceph auth get-or-create client.backup
    mon 'allow r'
    osd 'profile rbd pool=backup-pool'
    -o /etc/ceph/ceph.client.backup.keyring