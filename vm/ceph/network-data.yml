version: 2
ethernets:
  enp1s0:
    dhcp4: false
    dhcp6: false
    addresses:
      - ${DOMAIN_IP_ADDRESS}
    routes:
      - to: default
        via: 10.0.120.1
    nameservers:
      addresses:
        - 10.0.120.1
    # CEPH vlan (br-server, tag 20): egress, admin/SSH, and client I/O
    # with swarm all ride this one interface, routed via OPNsense
  enp2s0:
    dhcp4: false
    dhcp6: false
    addresses:
      - ${IP_INTERNAL_CLUSTER}
    # ceph-cluster: OSD replication/heartbeat, no gateway (isolated L2)
