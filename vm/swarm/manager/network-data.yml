version: 2
ethernets:
  enp1s0:
    dhcp4: false
    dhcp6: false
    addresses:
      - ${DOMAIN_IP_ADDRESS}
    routes:
      - to: default
        via: 192.168.122.1
    nameservers:
      addresses:
        - 192.168.122.1
    # br-dmz: public-facing NIC — WAN:80/443 gets DNAT'd here
  enp2s0:
    dhcp4: false
    dhcp6: false
    addresses:
      - ${SERVER_IP_ADDRESS}
    routes:
      - to: 10.0.110.0/24
        via: 10.0.130.1
      - to: 10.0.120.0/24
        via: 10.0.130.1
    # br-server VLAN 30: private channel to HARBOR (image pulls) and
    # CEPH (storage) only — no default route, not a general egress path
