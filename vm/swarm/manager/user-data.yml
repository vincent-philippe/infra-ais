#cloud-config
# Depends on registry (swarm can't run without registry access to pull image) bofore booting
users:
  - name: admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${AUTHORIZED_KEY}
chpasswd:
  expire: false
  users:
    - name: admin
      password: ${CONSOLE_ADMIN_PASSWORD}
      type: text
package_update: true
packages:
  - vim
  - htop
  - curl
  - openssl
  - docker.io
  - keepalived
  - ceph-common
  - ceph-fuse
write_files:
  - path: /etc/traefik/conf/traefik.toml
    encoding: b64
    permissions: '0644'
    content: |
      ${TRAEFIK_CONF}
  - path: /etc/traefik/tls.yml
    encoding: b64
    permissions: '0644'
    content: |
      ${TRAEFIK_TLS_CONF}
  - path: /docker-compose-traefik.yml
    encoding: b64
    permissions: '0644'
    content: |
      ${COMPOSE_TRAEFIK}
  - path: /etc/keepalived/keepalived.conf
    encoding: b64
    permissions: '0644'
    content: |
      ${KEEPALIVED_CONF}
  - path: /etc/ceph/ceph.conf
    encoding: b64
    permissions: '0644'
    content: |
      ${CEPH_CONF}
  - path: /etc/ceph/ceph.client.admin.keyring
    encoding: b64
    permissions: '0600'
    content: |
      ${CEPH_ADMIN_KEYRING}
  - path: /etc/ceph/ceph.client.docker.keyring
    encoding: b64
    permissions: '0600'
    content: |
      ${CEPH_DOCKER_KEYRING}
runcmd:
  # default is to run a manager, otherwise, just join the qorum as a reachable manager
  - docker swarm join --token ${SWARM_TOKEN_MANAGER} || docker swarm init --advertise-addr ${DOMAIN_IP}
  - echo "[$(date)] Swarm initialisé" >> /var/log/cloud-init.log
  - docker node ls >> /var/log/cloud-init.log
  # >>>> trust Harbor's self-signed cert (no CA to distribute from instead) >>>>
  - mkdir -p /usr/local/share/ca-certificates/${HARBOR_DOMAIN_NAME}
  - mkdir -p /etc/docker/certs.d/${HARBOR_DOMAIN_NAME}
  - |
    until openssl s_client -connect ${HARBOR_DOMAIN_NAME}:443 -showcerts </dev/null 2>/dev/null |
    openssl x509 -outform PEM > /usr/local/share/ca-certificates/${HARBOR_DOMAIN_NAME}/rootCA.crt; do
      echo "[$(date)] Registry not ready, waiting for ${HARBOR_DOMAIN_NAME}..." >> /var/log/cloud-init.log
      sleep 10
    done
  - cp /usr/local/share/ca-certificates/${HARBOR_DOMAIN_NAME}/rootCA.crt /etc/docker/certs.d/${HARBOR_DOMAIN_NAME}/ca.crt
  - update-ca-certificates
  - systemctl restart docker
  # <<<< trust Harbor's self-signed cert (no CA to distribute from instead) <<<<
  - echo "${HARBOR_ROBOT_PASSWORD}" | docker login ${HARBOR_DOMAIN_NAME} -u '${HARBOR_ROBOT_ACCOUNT}' --password-stdin
  # >>>> data specific to this network, create volume, network... >>>>
  - docker network create --driver overlay game_app_intra
  - mkdir -p /data/gameapp/db
  # <<<< data specific to this network, create volume, network... <<<<
  - echo "[$(date)] Cloud-init terminé" >> /var/log/cloud-init.log
  # <<<< TRAEFIK REVERSE PROXY PART <<<<
  # >>>> self-signed cert for traefik HTTPS >>>>
  - mkdir -p /etc/traefik/certs
  - openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/traefik/certs/local.key -out /etc/traefik/certs/local.crt -subj "/CN=*.swarm.horizon.fr"
  # <<<< self-signed cert for traefik HTTPS <<<<
  # Référencé en `external` par le stack traefik et par les stacks applicatives
  - docker network create --driver overlay --attachable traefik || true
  # >>>> TRAEFIK REVERSE PROXY PART >>>>
  # >>>> KEEPALIVED >>>>
  - systemctl enable --now keepalived
  # <<<< KEEPALIVED <<<<
  # >>>> CEPH UNIFIED STORAGE >>>>>
  - docker plugin install wetopi/rbd --grant-all-permissions --alias rbd RBD_CONF_POOL=docker-pool RBD_CONF_KEYRING_USER=client.docker # required for rbd pool storage
  - mkdir -p /etc/ceph
  # <<<< CEPH UNIFIED STORAGE <<<<<