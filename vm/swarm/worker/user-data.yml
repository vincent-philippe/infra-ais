#cloud-config
# Depends on swarm manager before booting
users:
  - name: admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${AUTHORIZED_KEY}
chpasswd:
  expire: false
  users:
    - name: admin
      password: ${CONSOLE_ADMIN_PASSWORD}
package_update: true
packages:
  - vim
  - htop
  - curl
  - docker.io
  - ceph-common
  - ceph-fuse
write_files:
  - path: /etc/ceph/ceph.conf
    encoding: b64
    permissions: '0644'
    content: |
      ${CEPH_CONF}
  - path: /etc/ceph/ceph.client.admin.keyring
    encoding: b64
    permissions: '0600'
    content: |
      ${CEPH_ADMIN_KEYRING}
  - path: /etc/ceph/ceph.client.docker.keyring
    encoding: b64
    permissions: '0600'
    content: |
      ${CEPH_DOCKER_KEYRING}
runcmd:
  - "until docker swarm join --token ${SWARM_TOKEN_WORKER}; do echo \"[$(date)] Swarm join failed, retrying...\"  >> /var/log/cloud-init.log; sleep 5; done" 
  - echo "[$(date)] Swarm initialisé" >> /var/log/cloud-init.log
  - docker node ls >> /var/log/cloud-init.log
  - echo "[$(date)] Cloud-init terminé" >> /var/log/cloud-init.log
  # >>>> CEPH UNIFIED STORAGE >>>>>
  - docker plugin install wetopi/rbd --grant-all-permissions --alias rbd RBD_CONF_POOL=docker-pool RBD_CONF_KEYRING_USER=client.docker # required for rbd pool storage
  # <<<< CEPH UNIFIED STORAGE <<<<<